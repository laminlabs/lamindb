name: profile

on:
  push:
    branches: [release]
    paths-ignore:
      - "lamindb/.agents/**"
  pull_request:
    paths-ignore:
      - "lamindb/.agents/**"

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAMIN_API_KEY: ${{ secrets.LAMIN_API_KEY_LAMINDB_DEV_BOT }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: pip install git+https://github.com/laminlabs/laminci
      - run: nox -s "install_ci(group='profile')"
      - run: uv pip install --system git+https://github.com/laminlabs/laminprofiler
      - run: lamin login
      - run: laminprofiler benchmark tests/profiling
